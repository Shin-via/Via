<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <title>회원가입</title>
</head>

<body>
<main class="signup-container">
    <h1>회원가입</h1>

    <form id="signupForm"
          th:action="@{/signup}"
          th:object="${memberRequest}"
          method="post">

        <div class="global-error"
             th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
                회원가입에 실패했습니다.
            </p>
        </div>

        <div class="form-group">
            <label for="loginEmail">이메일</label>

            <div class="input-button-row">
                <input type="email"
                       id="loginEmail"
                       th:field="*{loginEmail}"
                       th:readonly="${emailVerified}"
                       placeholder="example@email.com"
                       autocomplete="email">

                <button type="button"
                        id="sendCodeButton"
                        class="verification-button"
                        th:disabled="${emailVerified}">
                    인증번호 전송
                </button>
            </div>

            <div id="verificationArea"
                 class="input-button-row"
                 th:classappend="${emailVerified} ? ' hidden' : ''"
                 hidden>
                <input type="text"
                       id="verificationCode"
                       placeholder="인증번호 입력"
                       inputmode="numeric"
                       autocomplete="one-time-code">

                <button type="button"
                        id="verifyCodeButton"
                        class="verification-button">
                    인증하기
                </button>
            </div>

            <p id="emailVerificationMessage"
               th:class="${emailVerified}
                    ? 'success-message'
                    : 'field-error'"
               th:text="${emailVerified}
                    ? '이메일 인증이 완료되었습니다.'
                    : '이메일 인증을 먼저 완료해주세요.'">
            </p>

            <p class="field-error"
               th:if="${#fields.hasErrors('loginEmail')}"
               th:errors="*{loginEmail}">
                이메일 오류
            </p>

        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>

            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="8~64자로 입력해주세요"
                   autocomplete="new-password">

            <p class="field-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
                비밀번호 오류
            </p>
        </div>

        <div class="form-group">
            <label for="passwordConfirm">비밀번호 확인</label>

            <!-- DTO에 전달하지 않는 프론트 확인용 필드 -->
            <input type="password"
                   id="passwordConfirm"
                   placeholder="비밀번호를 다시 입력해주세요"
                   autocomplete="new-password">

            <p id="passwordMessage"
               class="field-error"></p>
        </div>

        <div class="form-group">
            <label for="userName">이름</label>

            <input type="text"
                   id="userName"
                   th:field="*{userName}"
                   placeholder="이름을 입력해주세요"
                   autocomplete="name">

            <p class="field-error"
               th:if="${#fields.hasErrors('userName')}"
               th:errors="*{userName}">
                이름 오류
            </p>
        </div>

        <div class="form-group">
            <label for="phoneNumber">휴대전화 번호</label>

            <input type="tel"
                   id="phoneNumber"
                   th:field="*{phoneNumber}"
                   placeholder="01012345678"
                   autocomplete="tel">
        </div>

        <div class="form-group">
            <label for="birthDate">생년월일</label>

            <input type="date"
                   id="birthDate"
                   th:field="*{birthDate}">

            <p class="field-error"
               th:if="${#fields.hasErrors('birthDate')}"
               th:errors="*{birthDate}">
                생년월일 오류
            </p>
        </div>

        <button type="submit"
                class="submit-button"
                th:disabled="${!emailVerified}">
            가입하기
        </button>
    </form>
</main>
<script th:src="@{/js/signup.js}"></script>
</body>
</html>
