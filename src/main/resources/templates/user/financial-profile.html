<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>금융 프로필</title>
    <link rel="stylesheet" th:href="@{/css/financial-profile.css}">
</head>

<body>

<a class="financial-profile-back"
   th:href="${returnTo}">← 이전 화면으로</a>

<h1>금융 프로필</h1>

<p th:if="${isNew}">
    금융 정보를 처음 등록해주세요.
</p>

<p th:unless="${isNew}">
    등록된 금융 정보를 확인하거나 수정할 수 있습니다.
</p>

<form th:object="${financialProfile}"
      th:action="@{${isNew ? '/financial-profile/new' : '/financial-profile/edit'}}"
      method="post">

    <input type="hidden" name="returnTo" th:value="${returnTo}">

    <input type="hidden"
           name="userId"
           th:value="${param.userId}">

    <div class="form-group">
        <label for="annualIncome">연 소득</label>
        <input type="number"
               id="annualIncome"
               th:field="*{annualIncome}"
               min="0"
               step="1"
               placeholder="연 소득을 입력해주세요">
    </div>

    <div class="form-group">
        <label for="incomeType">소득 유형</label>
        <select id="incomeType" th:field="*{incomeType}">
            <option value="">소득 유형을 선택해주세요</option>
            <option value="EMPLOYMENT">근로소득</option>
            <option value="BUSINESS">사업소득</option>
            <option value="FINANCIAL">금융소득</option>
            <option value="OTHER">기타소득</option>
        </select>
    </div>

    <div class="form-group">
        <label for="employmentStatus">고용 상태</label>
        <select id="employmentStatus" th:field="*{employmentStatus}">
            <option value="">고용 상태를 선택해주세요</option>

            <option th:each="status :
                    ${T(com.via.shinvia.finprofile.EmploymentStatus).values()}"
                    th:value="${status}"
                    th:text="${status.label}">
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="liquidAssetAmount">현금성 자산</label>
        <input type="number"
               id="liquidAssetAmount"
               th:field="*{liquidAssetAmount}"
               min="0"
               step="1"
               placeholder="현금성 자산을 입력해주세요">
    </div>

    <div class="form-group">
        <label for="creditScore">신용점수</label>
        <input type="number"
               id="creditScore"
               th:field="*{creditScore}"
               min="1"
               max="1000"
               placeholder="신용점수를 입력해주세요">
    </div>

    <button type="submit"
            th:text="${isNew} ? '등록하기' : '수정하기'">
        저장하기
    </button>

</form>

</body>
</html>
