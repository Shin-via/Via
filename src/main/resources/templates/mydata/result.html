<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이데이터 연동 완료</title>
    <link rel="stylesheet" th:href="@{/css/mydata-result.css}">
</head>

<body>
<main class="result-container">
    <section class="result-section">
        <h2 class="section-title">연동된 카드</h2>

        <p class="empty-message"
           th:if="${cards == null or #lists.isEmpty(cards)}">
            조회된 카드가 없습니다.
        </p>

        <div class="card-list" th:if="${cards != null and !#lists.isEmpty(cards)}">

            <div class="card-item" th:each="card : ${cards}">

                <h3 class="card-name" th:text="${card.cardName}">
                    카드 이름
                </h3>

                <p class="card-number" th:text="${card.cardNum}">
                    카드 번호
                </p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
