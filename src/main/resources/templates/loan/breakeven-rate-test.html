<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>한계금리 역산 테스트</title>
    <link rel="stylesheet" th:href="@{/css/loan-ratesimulation-common.css}">
    <link rel="stylesheet" th:href="@{/css/loan-breakeven-rate.css}">
</head>
<body>
<main class="page-shell">
    <header class="page-header">
        <h1>한계금리 역산 테스트</h1>
        <p class="hint">이 대출 금리가 몇 %까지 오르면 위험해지는지 계산합니다. (로컬 테스트 전용 페이지)</p>
        <p class="hint">
            로컬 시드 데이터 예시 — loanId=1 (정상, 주택담보대출), loanId=2 (연체, 신용대출 — 에러 확인용)
        </p>
    </header>

    <section class="card">
        <h2 class="card-title">조회 조건</h2>
        <form id="breakevenForm" class="form-grid">
            <div class="field">
                <label for="loanId">loanId</label>
                <input type="number" id="loanId" name="loanId" value="1" required min="1">
            </div>

            <div class="field">
                <label for="thresholdType">thresholdType</label>
                <select id="thresholdType" name="thresholdType">
                    <option value="MONTHLY_PAYMENT_AMOUNT">MONTHLY_PAYMENT_AMOUNT (월상환액 기준)</option>
                    <option value="INCOME_RATIO">INCOME_RATIO (소득 대비 비율, 현재 미지원)</option>
                </select>
            </div>

            <div class="field">
                <label for="thresholdValue">thresholdValue</label>
                <input type="number" id="thresholdValue" name="thresholdValue" value="1300000" required step="any">
            </div>

            <button type="submit" class="btn-primary" id="submitButton">계산하기</button>
        </form>

        <p id="errorMessage" class="banner banner-error hidden"></p>
    </section>

    <section id="resultArea" class="card hidden">
        <h2 class="card-title">결과</h2>

        <div class="result-heading">
            <div class="loan-label">
                <span class="loan-type" id="resultLoanType"></span>
                <span class="rate-type">· <span id="resultRateType"></span></span>
            </div>
            <span id="resultStatusBadge" class="badge"></span>
        </div>

        <div class="stat-grid">
            <div class="stat-tile">
                <span class="stat-label">현재 금리</span>
                <span class="stat-value"><span id="resultCurrentRate">-</span><span class="unit">%</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">현재 월상환액</span>
                <span class="stat-value"><span id="resultCurrentMonthlyPayment">-</span><span class="unit">원</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">한계금리</span>
                <span class="stat-value"><span id="resultBreakevenRate">-</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">여유 %p</span>
                <span class="stat-value"><span id="resultMarginPercent">-</span></span>
            </div>
            <div id="resultExcessTile" class="stat-tile stat-tile-critical hidden">
                <span class="stat-label">초과액</span>
                <span class="stat-value"><span id="resultExcessAmount">-</span><span class="unit">원</span></span>
            </div>
        </div>

        <p id="resultMessage" class="banner banner-info"></p>

        <details>
            <summary>원본 JSON</summary>
            <pre id="resultRawJson" class="raw-json"></pre>
        </details>
    </section>
</main>

<script th:src="@{/js/loan-breakeven-rate.js}"></script>
</body>
</html>
