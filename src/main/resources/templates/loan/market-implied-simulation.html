<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>시장 내재 금리 시나리오 테스트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/frame.css}">
    <link rel="stylesheet" th:href="@{/css/loan-ratesimulation-common.css}">
    <link rel="stylesheet" th:href="@{/css/via-theme.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<th:block th:replace="~{fragments/main-header :: mainHeader}"></th:block>
<main class="page-shell">
    <header class="page-header">
        <h1>시장 내재 금리 시나리오 테스트</h1>
        <p class="hint">
            채권 수익률곡선에서 뽑아낸 내재 선도금리를 이 대출에 적용했을 때 월상환액이 어떻게 변할지 보여줍니다. (로컬 테스트 전용 페이지)
        </p>
        <p class="hint">
            수익률곡선은 KOFIA 채권정보센터 승인 전이라 수동 입력값(bond_yield_curve 테이블) 기반입니다
        </p>
    </header>

    <section class="card">
        <h2 class="card-title">조회 조건</h2>
        <form id="marketImpliedForm" class="form-grid">
            <div class="field">
                <label for="loanId">loanId</label>
                <input type="number" id="loanId" name="loanId" th:value="${loanId}" required min="1" readonly>
            </div>

            <button type="submit" class="btn-primary" id="submitButton">조회</button>
        </form>

        <p id="errorMessage" class="banner banner-error hidden"></p>
    </section>

    <section id="resultArea" class="card hidden">
        <h2 class="card-title">결과</h2>

        <div class="result-heading">
            <div class="loan-label">
                <span id="resultLoanType"></span>
                <span class="rate-type">· <span id="resultRateType"></span></span>
            </div>
            <span id="resultStatusBadge" class="badge"></span>
        </div>

        <div class="stat-grid">
            <div class="stat-tile">
                <span class="stat-label">기준일</span>
                <span class="stat-value"><span id="resultAsOfDate">-</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">현재 금리</span>
                <span class="stat-value"><span id="resultInitialRate">-</span><span class="unit">%</span></span>
            </div>
        </div>

        <p id="resultMessage" class="banner banner-neutral hidden"></p>

        <div id="chartSection">
            <h3 class="section-title">선도금리 적용 시 월상환액 변화</h3>
            <div class="chart-card">
                <canvas id="monthlyPaymentChart"></canvas>
            </div>

            <h3 class="section-title">상세 내역</h3>
            <div class="table-wrap">
                <table id="resultTable">
                    <thead>
                    <tr>
                        <th>monthOffset</th>
                        <th>impliedRate</th>
                        <th>monthlyPayment</th>
                    </tr>
                    </thead>
                    <tbody id="resultTableBody"></tbody>
                </table>
            </div>
        </div>

        <p id="resultDataSource" class="banner banner-neutral"></p>
    </section>
</main>

<th:block th:replace="~{fragments/main-footer :: mainFooter}"></th:block>

<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/market-implied-simulation.js}"></script>
</body>
</html>
