<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계단식 금리 시나리오 테스트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/frame.css}">
    <link rel="stylesheet" th:href="@{/css/loan-ratesimulation-common.css}">
    <link rel="stylesheet" th:href="@{/css/staged-rate-simulation.css}">
    <link rel="stylesheet" th:href="@{/css/via-theme.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<th:block th:replace="~{fragments/main-header :: mainHeader}"></th:block>
<main class="page-shell">
    <header class="page-header">
        <h1>계단식 금리 시나리오 테스트</h1>
        <p class="hint">
            재산정 주기마다 금리가 단계적으로 오르내린다고 가정했을 때, 시점별 월상환액 변화를 보여줍니다. (로컬 테스트 전용 페이지)
        </p>
    </header>

    <section class="card">
        <h2 class="card-title">조회 조건</h2>
        <form id="stagedForm" class="form-grid">
            <div class="field">
                <label for="loanId">loanId</label>
                <input type="number" id="loanId" name="loanId" th:value="${loanId}" required min="1" readonly>
            </div>

            <div class="field">
                <label for="repricingCycleMonths">repricingCycleMonths</label>
                <input type="number" id="repricingCycleMonths" name="repricingCycleMonths" value="6" required min="1">
                <span class="field-note">재산정 주기(개월)</span>
            </div>

            <div class="field">
                <label for="stepDeltaPercent">stepDeltaPercent</label>
                <input type="number" id="stepDeltaPercent" name="stepDeltaPercent" value="0.25" required step="any">
                <span class="field-note">재산정마다 변동되는 %p</span>
            </div>

            <div class="field">
                <label for="stepCount">stepCount</label>
                <input type="number" id="stepCount" name="stepCount" value="5" required min="1">
                <span class="field-note">재산정 반복 횟수</span>
            </div>

            <button type="submit" class="btn-primary" id="submitButton">조회</button>
        </form>

        <p id="errorMessage" class="banner banner-error hidden"></p>
    </section>

    <section id="resultArea" class="card hidden">
        <h2 class="card-title">결과</h2>

        <div class="result-heading">
            <div class="loan-label">
                <span id="resultLoanType"></span>
                <span class="rate-type">· <span id="resultRateType"></span></span>
            </div>
            <span id="resultStatusBadge" class="badge"></span>
        </div>

        <div class="stat-grid">
            <div class="stat-tile">
                <span class="stat-label">초기 금리</span>
                <span class="stat-value"><span id="resultInitialRate">-</span><span class="unit">%</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">초기 월상환액</span>
                <span class="stat-value"><span id="resultInitialMonthlyPayment">-</span><span class="unit">원</span></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">구간이자 합계</span>
                <span class="stat-value"><span id="resultTotalSegmentInterest">-</span><span class="unit">원</span></span>
            </div>
        </div>

        <p id="resultMessage" class="banner banner-neutral hidden"></p>
        <p id="resultTruncated" class="banner banner-warning hidden">
            대출 만기가 이 시점 이전에 도래해서 계산을 중단했어요.
        </p>

        <div id="chartSection">
            <h3 class="section-title">월상환액 변화</h3>
            <div class="chart-card">
                <canvas id="monthlyPaymentChart"></canvas>
            </div>

            <h3 class="section-title">상세 내역</h3>
            <div class="table-wrap">
                <table id="resultTable">
                    <thead>
                    <tr>
                        <th>monthOffset</th>
                        <th>appliedRate</th>
                        <th>remainingBalance</th>
                        <th>monthlyPayment</th>
                        <th>segmentInterest</th>
                    </tr>
                    </thead>
                    <tbody id="resultTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/main-footer :: mainFooter}"></th:block>

<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/staged-rate-simulation.js}"></script>
</body>
</html>
