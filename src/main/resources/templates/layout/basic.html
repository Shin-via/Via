<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="layout(pageTitle, pageContent, serviceName)">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:replace="${pageTitle}">SHINVIA</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" th:href="@{/css/frame.css}">
        <link rel="stylesheet" th:href="@{/css/policy.css}">
        <link rel="stylesheet" th:href="@{/css/loan-recommendation.css}">
        <link rel="stylesheet" th:href="@{/css/via-theme.css}">
        <script defer th:src="@{/js/script.js}"></script>
        <script defer th:src="@{/js/policy.js}"></script>
        <script defer th:src="@{/js/loan-recommendation.js}"></script>
    </head>

    <body>
    <th:block th:replace="~{fragments/main-header :: mainHeader}"></th:block>

    <div class="site-layout">
        <aside class="service-sidebar" aria-label="금융 서비스 메뉴">
            <nav class="sidebar-navigation">
                <details class="sidebar-menu-group">
                    <summary>금융 진단센터</summary>
                    <ul>
                        <li><span class="sidebar-menu-disabled">현재 금융 현황 <small>준비중</small></span></li>
                        <li><span class="sidebar-menu-disabled">스트레스 DSR 분석 <small>준비중</small></span></li>
                    </ul>
                </details>

                <details class="sidebar-menu-group">
                    <summary>대출</summary>
                    <ul>
                        <li><a th:href="@{/loans/recommendations}">대출 상품 추천</a></li>
                        <li><a th:href="@{/loans/breakeven-rate-test}">금리상승 취약도</a></li>
                        <li><a th:href="@{/loan-analysis/debt-priority}">부채 상환 우선순위</a></li>
                        <li><a th:href="@{/loan-analysis/scenarios}">대출 대응방안 비교</a></li>
                    </ul>
                </details>

                <details class="sidebar-menu-group">
                    <summary>정책금융상품</summary>
                    <ul>
                        <li><a th:href="@{/policy-support}">서민금융상품</a></li>
                        <li><a th:href="@{/asset-products}">자산형성상품</a></li>
                        <li><a th:href="@{/social-finance}">사회연대금융</a></li>
                        <li><a th:href="@{/welfare-support}">복합지원</a></li>
                        <li><a th:href="@{/policy/recommendation}">맞춤 금융지원상품 추천</a></li>
                    </ul>
                </details>

                <details class="sidebar-menu-group">
                    <summary>금융정책 안내</summary>
                    <ul>
                        <li><a th:href="@{/financial-policy/stress-dsr}">스트레스 DSR </a></li>
                        <li><a th:href="@{/financial-policy/household-dsr}">가계대출·DSR 규제 </a></li>
                        <li><a th:href="@{/financial-policy/mortgage-regulation}">주택담보대출 규제 </a></li>
                        <li><a th:href="@{/financial-policy/jeonse-regulation}">전세대출 규제</a></li>
                        <li><a th:href="@{/financial-policy/policy-loan}">정책대출 제도 </a></li>
                    </ul>
                </details>
            </nav>
        </aside>

        <div class="site-content">
            <main th:replace="${pageContent}">페이지 본문</main>
        </div>
    </div>

    <th:block th:replace="~{fragments/main-footer :: mainFooter}"></th:block>
    </body>
</th:block>
</html>
